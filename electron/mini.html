<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>专注</title>
<style>
  /* 透明无边框窗口：整页背景必须是透明的，圆角由卡片自己画。 */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    -webkit-app-region: drag;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    font-family: "Inter", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  .card {
    box-sizing: border-box;
    width: 264px;
    height: 96px;
    padding: 0 14px 0 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-radius: 26px;
    background: #101010;
    color: #ffffff;
    /* 透明窗口上没有系统阴影（会带黑边），阴影交给这里画。 */
    box-shadow: 0 14px 34px rgba(0, 0, 0, .34), 0 0 0 1px rgba(255, 255, 255, .06) inset;
  }

  /* 进度环：svg 画底圈 + 进度圈，靠 stroke-dashoffset 推进。 */
  .ring { position: relative; width: 52px; height: 52px; flex: none; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255, 255, 255, .14); }
  .ring .bar { stroke: #ffffff; stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s ease; }
  .ring .dot {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(255, 255, 255, .55); transition: background .3s ease;
  }
  /* 休息阶段用另一种颜色，扫一眼就知道现在该干什么。 */
  .card.break .ring .bar { stroke: #c7c0f0; }
  .card.break .ring .dot { background: #c7c0f0; }
  .card.longBreak .ring .bar { stroke: #a8e6c1; }
  .card.longBreak .ring .dot { background: #a8e6c1; }

  .copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .time {
    font-size: 27px; font-weight: 800; line-height: 1; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .meta { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #8b8b85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 暂停时整块变淡，不用盯着数字猜停没停。 */
  .card.paused .time, .card.paused .meta { opacity: .45; }
  .card.paused .ring .bar { stroke: #5a5a56; }
  .card.paused .ring .dot { background: #5a5a56; }

  .actions { display: flex; flex-direction: column; gap: 6px; flex: none; }
  button {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .12); color: #ffffff;
    cursor: pointer; transition: background .16s ease, transform .12s ease;
  }
  button:hover { background: rgba(255, 255, 255, .24); }
  button:active { transform: scale(.9); }
  button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  button svg { display: block; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ring">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="track" cx="26" cy="26" r="22" fill="none" stroke-width="3" />
        <circle class="bar" id="bar" cx="26" cy="26" r="22" fill="none" stroke-width="3"
                stroke-dasharray="138.23" stroke-dashoffset="0" />
      </svg>
      <i class="dot"></i>
    </div>
    <div class="copy">
      <div class="time" id="time">25:00</div>
      <div class="meta" id="meta">专注 · 第 1 / 4 轮</div>
    </div>
    <div class="actions">
      <button id="toggle" type="button" aria-label="暂停" title="暂停">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
          <rect x="2" y="1.5" width="3" height="9" rx="1" />
          <rect x="7" y="1.5" width="3" height="9" rx="1" />
        </svg>
      </button>
      <button id="close" type="button" aria-label="收起小窗" title="收起小窗">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 3l6 6M9 3l-6 6" />
        </svg>
      </button>
    </div>
  </div>

<script>
  // 主进程每 200ms 来取一次。小窗自己不认识计时逻辑，
  // 只负责把状态画出来、把按钮点击攒进队列等人取走。
  var outbox = [];
  var last = null;
  var CIRCUMFERENCE = 2 * Math.PI * 22;

  var card = document.getElementById('card');
  var bar = document.getElementById('bar');
  var timeEl = document.getElementById('time');
  var metaEl = document.getElementById('meta');
  var toggleEl = document.getElementById('toggle');

  var PAUSE_ICON = '<svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>';
  var PLAY_ICON = '<svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.6v8.8a.6.6 0 0 0 .92.5l6.6-4.4a.6.6 0 0 0 0-1L3.92 1.1a.6.6 0 0 0-.92.5Z"/></svg>';

  function clock(ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return m + ':' + (s < 10 ? '0' + s : String(s));
  }

  function paint(snap) {
    if (!snap) return;
    var key = snap.phase + '|' + snap.running + '|' + Math.ceil(snap.remaining / 1000) + '|' + snap.rounds + '|' + snap.roundsBeforeLong;
    if (key === last) return;   // 同一秒内不重复改 DOM
    last = key;

    var names = { focus: '专注', break: '小憩', longBreak: '长休息' };
    card.className = 'card ' + snap.phase + (snap.running ? '' : ' paused');

    timeEl.textContent = clock(snap.remaining);

    var rounds = Math.max(1, Math.min(snap.roundsBeforeLong || 4, (snap.rounds || 0) + 1));
    var tail = snap.phase === 'focus' ? '第 ' + rounds + ' / ' + (snap.roundsBeforeLong || 4) + ' 轮' : '让眼睛歇一下';
    metaEl.textContent = names[snap.phase] + ' · ' + tail + (snap.running ? '' : ' · 已暂停');

    // 进度环按「已经走了多少」画，走满正好一圈。
    var total = Math.max(1, snap.total || 1);
    var done = Math.min(1, Math.max(0, 1 - snap.remaining / total));
    bar.setAttribute('stroke-dashoffset', String(CIRCUMFERENCE * (1 - done)));

    toggleEl.innerHTML = snap.running ? PAUSE_ICON : PLAY_ICON;
    toggleEl.setAttribute('aria-label', snap.running ? '暂停' : '继续');
    toggleEl.setAttribute('title', snap.running ? '暂停' : '继续');
  }

  window.__ravenMiniPaint = paint;
  window.__ravenMiniDrain = function () {
    if (!outbox.length) return [];
    var list = outbox;
    outbox = [];
    return list;
  };

  toggleEl.addEventListener('click', function () { outbox.push('toggle'); });
  document.getElementById('close').addEventListener('click', function () { outbox.push('close'); });
  // 键盘也能用：小窗被点中时按空格暂停，Esc 收起。
  document.addEventListener('keydown', function (event) {
    if (event.key === ' ' || event.code === 'Space') { event.preventDefault(); outbox.push('toggle'); }
    else if (event.key === 'Escape') { outbox.push('close'); }
  });
</script>
</body>
</html>
