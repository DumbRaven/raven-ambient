<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      桌面放映窗的入口。和 index.html 用同一套 CSP：这个窗口只画版式，
      不需要比主界面更多的权限。
      唯一不同的地方是它没有开屏动画——这个窗口是用户点了「放到桌面」才出现的，
      再放一遍 logo 只会让桌面先黑一块。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: media:; media-src 'self' blob: media:; connect-src 'self' media: ws://127.0.0.1:5173; object-src 'none'; base-uri 'self'; frame-src 'none'" />
    <title>Raven Ambient · 桌面放映</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/desktop.tsx"></script>
  </body>
</html>
