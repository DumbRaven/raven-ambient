name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的版本标签，例如 v0.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 包
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 这里不设 ELECTRON_SKIP_BINARY_DOWNLOAD：scripts/package-win.cjs 的
      # electronDist 指向 node_modules/electron/dist，必须让 npm ci 正常装下二进制
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 编译辅助程序
        run: node scripts/build-nowplaying.cjs

      # package-win.cjs 直接把 dist 和 electron 拷进暂存目录，dist 得先有
      - name: 构建渲染层
        run: npm run build

      - name: 打包
        run: node scripts/package-win.cjs

      - name: 打包产物自检
        shell: bash
        run: |
          exe="release/win-unpacked/Raven Ambient Bold.exe"
          asar="release/win-unpacked/resources/app.asar"
          unpacked="release/win-unpacked/resources/app.asar.unpacked/electron/nowplaying/NowPlaying.exe"
          test -f "$exe" || { echo "缺少 $exe"; exit 1; }
          test -f "$asar" || { echo "缺少 $asar"; exit 1; }
          test -f "$unpacked" || { echo "缺少 $unpacked（辅助程序没解包出来）"; exit 1; }
          echo "exe:  $(stat -c%s "$exe") 字节"
          echo "asar: $(stat -c%s "$asar") 字节"

      - name: 打成 tar.xz 分发包
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $env:RAVEN_VERSION = $tag
          node scripts/make-release.cjs
          $name = "Raven-Ambient-$tag-win-x64.tar.xz"
          "ARCHIVE=release/dist/$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LAUNCHER=release/dist/解压后运行我.cmd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: raven-ambient-win-x64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.LAUNCHER }}
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.LAUNCHER }}
          generate_release_notes: true
          body: |
            下载 `Raven-Ambient-*-win-x64.tar.xz` 和 `解压后运行我.cmd`，把两个文件放到同一个文件夹里，
            双击 `解压后运行我.cmd` 就会解压并打开目录，然后运行里面的 `Raven Ambient Bold.exe`。免安装。

            也可以自己用 7-Zip 解压那个 `.tar.xz`。Windows 10 1803 之后系统自带的 tar 也能解。

            外部音乐模式需要先装 [VB-Audio Virtual Cable](https://vb-audio.com/Cable/)，
            分发包里的「可选-虚拟声卡」文件夹有安装包和使用说明。
